[project]
name = "tapo-c220"
version = "0.1.0"
description = "TP-Link Tapo C220 を RTSP / ONVIF (Profile S) / Tapo 独自の経路で操作するライブラリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
tapo = [  # Tapo 独自の API と録画（設定の読み書き、microSD の録画）
    "cryptography>=50.0.2",
    "pytapo>=3.4.26",
]
packets = [  # 映像と音声を、変換していないパケットとして取り出す（packets）
    "av>=14",
]

[project.scripts]
tapo-c220 = "tapo_c220.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "tapo-c220[packets,tapo]",
    "tapo-c220-webui",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
tapo-c220-webui = { workspace = true }

[tool.uv.workspace]
members = ["examples/*"]  # 使用例（ライブラリには含めない）

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/webui/tests"]
pythonpath = ["examples/webui"]
