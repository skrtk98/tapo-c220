<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapo C220</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f4f5f7, #15171a); --panel: light-dark(#fff, #1e2125); --line: light-dark(#d9dce1, #33383f);
    --text: light-dark(#1c1f23, #e6e8eb); --muted: light-dark(#667085, #98a1ad);
    --accent: light-dark(#0b6bcb, #5aa9f5); --danger: light-dark(#c62828, #f2776f);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  #device { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  aside { display: grid; gap: 16px; align-content: start; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  button, select, input[type=text] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .screen { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; display: grid; place-items: center; margin-bottom: 10px; }
  .screen video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen p { color: #9aa3ad; margin: 0; }
  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; justify-content: center; }
  .pad button { font-size: 20px; padding: 0; touch-action: none; user-select: none; }
  .pad button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pad .stop { font-size: 12px; }
  label { color: var(--muted); font-size: 12px; }
  input[type=range] { flex: 1; min-width: 80px; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  li { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 12px; }
  li audio, li video { width: 100%; }
  li .row { justify-content: space-between; }
  a { color: var(--accent); }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .segments { max-height: 220px; overflow-y: auto; margin-top: 10px; display: grid; gap: 4px; }
  .segments button { text-align: left; font-family: ui-monospace, monospace; font-size: 12px; }
  .segments button.event { border-left: 3px solid var(--danger); }
  input[type=datetime-local], input[type=number] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
  #message { min-height: 1.5em; font-size: 12px; color: var(--muted); margin-left: auto; }
  #message.error { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Tapo C220</h1>
  <span id="device">接続中…</span>
  <span id="message" role="status"></span>
</header>
<main>
  <div style="display:grid;gap:16px;align-content:start">
    <section>
      <h2>ライブ映像</h2>
      <div class="screen" id="screen"><p>停止中</p></div>
      <div class="row">
        <select id="mode" aria-label="映像の種類">
          <option value="rtc-sub">WebRTC 640×360（低遅延・音あり）</option>
          <option value="rtc-main">WebRTC 2560×1440（低遅延・音あり）</option>
          <option value="audio">音だけ</option>
          <option value="off">停止</option>
        </select>
        <button id="reload">つなぎ直す</button>
        <a id="snapshot" href="/api/snapshot.jpg" target="_blank" rel="noopener">静止画（2560×1440）</a>
      </div>
    </section>
    <section>
      <h2>録音・録画（カメラのマイクと映像を、このサーバに保存）</h2>
      <div class="row">
        <button id="rec-audio">● 録音（WAV）</button>
        <button id="rec-video">● 録画（MP4）</button>
        <button id="rec-stop" disabled>■ 止める</button>
        <span id="rec-status" class="mono"></span>
      </div>
      <ul id="recordings"></ul>
    </section>
    <section>
      <h2>microSD の録画（カメラ本体の録画から、一部を取り出して上の一覧に保存）</h2>
      <div class="row">
        <select id="sd-day" aria-label="録画のある日"></select>
        <span id="sd-status" class="mono"></span>
      </div>
      <div class="segments" id="sd-segments"></div>
      <div class="row">
        <label for="sd-start">開始</label><input id="sd-start" type="datetime-local" step="1">
        <label for="sd-seconds">長さ（秒）</label><input id="sd-seconds" type="number" min="1" max="3600" value="60" style="width:80px">
        <button id="sd-export">取り出す</button>
        <button id="sd-cancel" disabled>■ 止める</button>
      </div>
      <p class="mono" id="sd-progress" style="margin:10px 0 0">録画は実時間の速さでしか届かない（60 秒ぶんの取り出しに約 60 秒かかる）。</p>
    </section>
  </div>
  <aside>
    <section>
      <h2>首振り（ONVIF PTZ）</h2>
      <div class="pad">
        <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
        <button data-dir="left" aria-label="左">◀</button><button class="stop" id="ptz-stop">停止</button><button data-dir="right" aria-label="右">▶</button>
        <span></span><button data-dir="down" aria-label="下">▼</button><span></span>
      </div>
      <div class="row">
        <label for="ptz-mode">動かし方</label>
        <select id="ptz-mode">
          <option value="hold">押している間だけ動く</option>
          <option value="step">1回押すと少し動く</option>
        </select>
      </div>
      <div class="row"><label for="speed">速さ・量</label><input id="speed" type="range" min="0.1" max="1" step="0.1" value="0.5"></div>
      <div class="row mono" id="position">pan – / tilt –</div>
      <div class="row">
        <input id="preset-name" type="text" placeholder="プリセット名" maxlength="32" style="flex:1;min-width:0">
        <button id="preset-save">今の向きを保存</button>
      </div>
      <ul id="presets"></ul>
    </section>
    <section>
      <h2>カメラのスピーカーで鳴らす</h2>
      <div class="row"><input id="file" type="file" accept="audio/*,video/*" style="flex:1;min-width:0"></div>
      <div class="row"><label for="gain">音量</label><input id="gain" type="range" min="-20" max="20" step="1" value="0"><span id="gain-value" class="mono">0 dB</span></div>
      <div class="row">
        <button id="play">ファイルを鳴らす</button>
        <button id="mic">🎙 マイクで話す</button>
        <button id="speaker-stop" disabled>■ 止める</button>
      </div>
      <p class="mono" style="margin:10px 0 0">Tapo 独自の双方向音声（8800 番）。鳴り終わるか止めるまで、次は送れない。</p>
    </section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const say = (text, error = false) => { $("message").textContent = text; $("message").classList.toggle("error", error); };

async function api(path, options = {}) {
  if (options.json !== undefined) {
    options = { ...options, method: options.method || "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(options.json) };
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join(" / ") : data.detail;
    throw new Error(detail || `HTTP ${response.status}`);
  }
  return data;
}
const run = (work) => async (...args) => { try { await work(...args); } catch (e) { say(e.message, true); } };
const size = (bytes) => bytes > 1e6 ? (bytes / 1e6).toFixed(1) + " MB" : Math.ceil(bytes / 1e3) + " kB";

// --- ライブ映像 ---
let peer = null, retry = null, liveId = 0;

// WebRTC：offer を作り、ICE の候補を集め終えてからサーバへ送る（合図は1往復だけ）
async function startRtc(video, stream, mine) {
  const pc = peer = new RTCPeerConnection();
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.addTransceiver("audio", { direction: "recvonly" });
  pc.addEventListener("track", (event) => { video.srcObject = event.streams[0] || new MediaStream([event.track]); });
  pc.addEventListener("connectionstatechange", () => {
    if (mine !== liveId) return;
    if (pc.connectionState === "connected") say("");
    if (["failed", "disconnected"].includes(pc.connectionState)) {  // 切れたら、少し待ってつなぎ直す
      say("映像が切れた。つなぎ直す…", true);
      clearTimeout(retry);
      retry = setTimeout(showLive, 2000);
    }
  });
  await pc.setLocalDescription(await pc.createOffer());
  if (pc.iceGatheringState !== "complete") {
    await new Promise((resolve) => {
      pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && resolve());
      setTimeout(resolve, 3000);
    });
  }
  if (mine !== liveId) return;
  const answer = await api("/api/webrtc/offer", { json: { sdp: pc.localDescription.sdp, type: "offer", stream } });
  if (mine !== liveId) return;  // 待っている間に別の表示へ切り替えられた（この接続は、ICE が通らずサーバ側で閉じられる）
  await pc.setRemoteDescription(answer);
}

function showLive() {
  const screen = $("screen"), mode = $("mode").value, mine = ++liveId;
  clearTimeout(retry);
  peer?.close();
  peer = null;
  for (const media of screen.querySelectorAll("video, audio")) { media.srcObject = null; media.removeAttribute("src"); media.load?.(); }  // 前の接続を閉じる
  screen.replaceChildren();
  const stamp = Date.now();
  let element;
  if (mode.startsWith("rtc")) {
    element = Object.assign(document.createElement("video"), { autoplay: true, controls: true, muted: true, playsInline: true });
    startRtc(element, mode === "rtc-main" ? "stream1" : "stream2", mine).catch((e) => { if (mine === liveId) say(e.message, true); });
  } else if (mode === "audio") {
    element = Object.assign(document.createElement("audio"), { src: `/live.mp3?${stamp}`, autoplay: true, controls: true });
  } else {
    element = Object.assign(document.createElement("p"), { textContent: "停止中" });
  }
  element.addEventListener("error", () => say("映像を受け取れない（同時に見られるのは3接続まで）", true));
  screen.append(element);
}
addEventListener("pagehide", () => peer?.close());
$("mode").addEventListener("change", showLive);
$("reload").addEventListener("click", showLive);

// --- 首振り ---
let tracking = 0;
function showPosition(p) {
  $("position").textContent = `pan ${p.pan.toFixed(3)} / tilt ${p.tilt.toFixed(3)}`;
  trackPosition();
}
// 移動の指示はすぐ戻り、カメラは動き終えたことを知らせない。位置が変わらなくなるまで読み直す
async function trackPosition() {
  const mine = ++tracking;
  let last = "";
  for (let i = 0; i < 40 && mine === tracking; i++) {
    await new Promise((resolve) => setTimeout(resolve, 500));
    const p = await api("/api/ptz").catch(() => null);
    if (!p || mine !== tracking) return;
    const text = `pan ${p.pan.toFixed(3)} / tilt ${p.tilt.toFixed(3)}`;
    $("position").textContent = text;
    if (text === last) return;
    last = text;
  }
}
let moving = null, keepAlive = null, moveId = 0;

async function startMove(direction, button) {
  const value = Number($("speed").value);
  if ($("ptz-mode").value === "step") {
    showPosition(await api("/api/ptz/step", { json: { direction, amount: value * 0.1 } }));
    return;
  }
  const mine = ++moveId;
  moving = direction;
  button?.classList.add("active");
  const send = () => api("/api/ptz/move", { json: { direction, speed: value } });
  await send();
  if (mine !== moveId) {
    // 最初の指示が届く前に離された。停止が移動より先にカメラへ着いたかもしれないので、もう一度止める
    if (moving === null) showPosition(await api("/api/ptz/stop", { method: "POST" }));
    return;
  }
  keepAlive = setInterval(run(send), 3000);  // カメラ側の自動停止（5秒）より短い間隔で送り直す
}
async function stopMove() {
  moveId++;
  clearInterval(keepAlive);
  document.querySelectorAll(".pad .active").forEach((b) => b.classList.remove("active"));
  if (moving === null) return;
  moving = null;
  showPosition(await api("/api/ptz/stop", { method: "POST" }));
}
for (const button of document.querySelectorAll(".pad [data-dir]")) {
  button.addEventListener("pointerdown", run(async (event) => { button.setPointerCapture(event.pointerId); await startMove(button.dataset.dir, button); }));
  for (const name of ["pointerup", "pointercancel", "lostpointercapture"]) button.addEventListener(name, run(stopMove));
}
$("ptz-stop").addEventListener("click", run(async () => { moveId++; moving = null; clearInterval(keepAlive); showPosition(await api("/api/ptz/stop", { method: "POST" })); }));
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
const typing = (event) => ["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName);
addEventListener("keydown", run(async (event) => {
  if (!KEYS[event.key] || typing(event) || event.repeat) return;
  event.preventDefault();
  if (moving === null) await startMove(KEYS[event.key], document.querySelector(`[data-dir=${KEYS[event.key]}]`));
}));
addEventListener("keyup", run(async (event) => { if (KEYS[event.key] && !typing(event)) await stopMove(); }));
addEventListener("blur", run(stopMove));

async function loadPresets() {
  const list = await api("/api/ptz/presets");
  $("presets").replaceChildren(...list.map((preset) => {
    const item = document.createElement("li"), row = Object.assign(document.createElement("div"), { className: "row" });
    const go = Object.assign(document.createElement("button"), { textContent: preset.name || preset.token });
    go.addEventListener("click", run(async () => { await api(`/api/ptz/presets/${encodeURIComponent(preset.token)}/goto`, { method: "POST" }); showPosition(await api("/api/ptz")); }));
    const remove = Object.assign(document.createElement("button"), { textContent: "削除" });
    remove.addEventListener("click", run(async () => { await api(`/api/ptz/presets/${encodeURIComponent(preset.token)}`, { method: "DELETE" }); await loadPresets(); }));
    row.append(go, remove); item.append(row);
    return item;
  }));
}
$("preset-save").addEventListener("click", run(async () => {
  const name = $("preset-name").value.trim();
  if (!name) return say("プリセット名を入れること", true);
  await api("/api/ptz/presets", { json: { name } });
  $("preset-name").value = "";
  await loadPresets();
  say(`プリセット「${name}」を保存した`);
}));

// --- 録音・録画 ---
let recTimer = null;
async function showRecording() {
  const status = await api("/api/record");
  $("rec-audio").disabled = $("rec-video").disabled = status.recording;
  $("rec-stop").disabled = !status.recording;
  $("rec-stop").classList.toggle("on", status.recording);
  $("rec-status").textContent = status.recording ? `${status.kind === "audio" ? "録音" : "録画"}中 ${Math.floor(status.seconds)} 秒` : "";
  clearTimeout(recTimer);
  if (status.recording) recTimer = setTimeout(run(showRecording), 1000);
}
async function loadRecordings() {
  const list = await api("/api/recordings");
  $("recordings").replaceChildren(...list.map((file) => {
    const item = document.createElement("li"), row = Object.assign(document.createElement("div"), { className: "row" });
    const url = `/recordings/${file.name}`;
    const link = Object.assign(document.createElement("a"), { href: url, download: file.name, textContent: `${file.name}（${size(file.bytes)}）` });
    const remove = Object.assign(document.createElement("button"), { textContent: "削除" });
    remove.addEventListener("click", run(async () => { await api(`/api/recordings/${file.name}`, { method: "DELETE" }); await loadRecordings(); }));
    row.append(link, remove);
    const player = Object.assign(document.createElement(file.name.endsWith(".mp4") ? "video" : "audio"), { src: url, controls: true, preload: "none" });
    item.append(row, player);
    return item;
  }));
}
const startRecording = (kind) => run(async () => { await api("/api/record/start", { json: { kind } }); await showRecording(); say(""); });
$("rec-audio").addEventListener("click", startRecording("audio"));
$("rec-video").addEventListener("click", startRecording("video"));
$("rec-stop").addEventListener("click", run(async () => {
  try { const file = await api("/api/record/stop", { method: "POST" }); say(`${file.name} を保存した`); }
  finally { await showRecording(); await loadRecordings(); }
}));

// --- microSD の録画 ---
const clock = (t) => new Date(t * 1000).toLocaleTimeString("ja-JP", { hour12: false });
const span = (s) => s >= 60 ? `${Math.floor(s / 60)}分${Math.round(s % 60)}秒` : `${Math.round(s)}秒`;
function toLocalInput(t) {  // datetime-local の値（その場所の時刻）
  const d = new Date(t * 1000), pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
async function loadSdDay() {
  const day = $("sd-day").value;
  if (!day) return;
  $("sd-segments").replaceChildren(Object.assign(document.createElement("span"), { className: "mono", textContent: "読み込み中…" }));
  const list = await api(`/api/sd/segments?date=${day}`);
  $("sd-segments").replaceChildren(...list.reverse().map((segment) => {
    const length = segment.end - segment.start, kind = segment.kind === "event" ? "検知" : segment.kind === "continuous" ? "常時" : segment.kind;
    const button = Object.assign(document.createElement("button"), { textContent: `${clock(segment.start)} 〜 ${clock(segment.end)}　${span(length)}　${kind}`, title: "この区間を「開始」と「長さ」に入れる" });
    button.classList.toggle("event", segment.kind === "event");
    button.addEventListener("click", () => { $("sd-start").value = toLocalInput(segment.start); $("sd-seconds").value = Math.min(3600, Math.max(1, Math.round(length))); });
    return button;
  }));
}
async function loadSd() {
  const info = await api("/api/sd");
  const card = info.status;
  $("sd-status").textContent = card.status ? `カード: ${card.status}　空き ${card.free_space} / ${card.total_space}` : "カードが無い";
  $("sd-day").replaceChildren(...info.days.reverse().map((day) => Object.assign(document.createElement("option"), { value: day, textContent: `${day.slice(0, 4)}-${day.slice(4, 6)}-${day.slice(6)}` })));
  await loadSdDay();
}
let sdTimer = null;
async function showSdExport() {
  const job = await api("/api/sd/export");
  $("sd-export").disabled = job.running;
  $("sd-cancel").disabled = !job.running;
  clearTimeout(sdTimer);
  if (job.running) {
    $("sd-progress").textContent = `取り出し中: ${job.name}　${Math.floor(job.done)} / ${Math.round(job.seconds)} 秒`;
    sdTimer = setTimeout(run(showSdExport), 1000);
  } else if (job.name) {
    $("sd-progress").textContent = job.error ? `${job.name}: ${job.error}` : `${job.name} を保存した`;
    $("sd-progress").style.color = job.error ? "var(--danger)" : "";
    await loadRecordings();
  }
}
$("sd-day").addEventListener("change", run(loadSdDay));
$("sd-export").addEventListener("click", run(async () => {
  const start = new Date($("sd-start").value).getTime() / 1000, seconds = Number($("sd-seconds").value);
  if (!start) return say("開始の時刻を入れること（一覧の区間を押すと入る）", true);
  $("sd-progress").style.color = "";
  await api("/api/sd/export", { json: { start, seconds } });
  await showSdExport();
}));
$("sd-cancel").addEventListener("click", run(() => api("/api/sd/export/cancel", { method: "POST" })));

// --- スピーカー ---
$("gain").addEventListener("input", () => { $("gain-value").textContent = `${$("gain").value} dB`; });
async function sendAudio(blob, name) {
  const form = new FormData();
  form.append("file", blob, name);
  $("play").disabled = $("mic").disabled = true;
  $("speaker-stop").disabled = false;
  say("カメラのスピーカーで再生中…");
  try {
    const result = await api(`/api/speaker/play?gain_db=${$("gain").value}`, { method: "POST", body: form });
    say(result.stopped ? "再生を止めた" : `${result.seconds} 秒ぶん鳴らした`);
  } finally { $("play").disabled = $("mic").disabled = false; $("speaker-stop").disabled = true; }
}
$("speaker-stop").addEventListener("click", run(() => api("/api/speaker/stop", { method: "POST" })));
$("play").addEventListener("click", run(async () => {
  const file = $("file").files[0];
  if (!file) return say("音声ファイルを選ぶこと", true);
  await sendAudio(file, file.name);
}));
let recorder = null;
$("mic").addEventListener("click", run(async () => {
  if (recorder) return recorder.stop();
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("このページではマイクを使えない（localhost か HTTPS で開くこと）");
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.addEventListener("dataavailable", (event) => chunks.push(event.data));
  recorder.addEventListener("stop", run(async () => {
    const type = recorder.mimeType;
    stream.getTracks().forEach((track) => track.stop());
    recorder = null;
    $("mic").textContent = "🎙 マイクで話す"; $("mic").classList.remove("on");
    await sendAudio(new Blob(chunks, { type }), type.includes("ogg") ? "mic.ogg" : type.includes("mp4") ? "mic.mp4" : "mic.webm");
  }));
  recorder.start();
  $("mic").textContent = "■ 話し終えて送る"; $("mic").classList.add("on");
  say("録音中。話し終えたらもう一度押す");
}));

// --- 起動 ---
run(async () => {
  const info = await api("/api/info");
  $("device").textContent = `${info.device.Model} / FW ${info.device.FirmwareVersion}`;
  showPosition(info.position);
  if (!info.speaker) { $("play").disabled = $("mic").disabled = true; say("TAPO_CLOUD_PASSWORD が無いので、スピーカーは使えない"); }
  await Promise.all([loadPresets(), showRecording(), loadRecordings()]);
  if (info.speaker) await Promise.all([loadSd(), showSdExport()]);
  else $("sd-status").textContent = "TAPO_CLOUD_PASSWORD が無いので使えない";
})();
showLive();
</script>
</body>
</html>
